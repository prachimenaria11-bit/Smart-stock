<title>SmartStock — Neighbourhood Market Intelligence</title>
<style>

.sh{overflow:visible}.leg{transform-origin:center 62px;animation:sw .6s ease-in-out infinite alternate}.l1{transform-origin:25px 62px}.l2{transform-origin:35px 62px;animation-direction:alternate-reverse}@keyframes sw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}

.grid{display:grid;gap:16px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:18px 0}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

.plan{background:var(--sf2);border-radius:18px;padding:10px;border:1px solid var(--bd)}.tile{fill:var(--tile);stroke:var(--bd);transition:.3s}.tile.hl{fill:var(--acc);stroke:var(--acc)}.tl{fill:var(--mut);font-weight:700}.lane{fill:var(--bd);opacity:.6}.route{stroke:var(--g)}.dest{fill:var(--acc);stroke:var(--sf);stroke-width:3}.ent{fill:var(--g)}

.ycard{background:var(--y1);color:var(--yi);border-color:transparent;position:relative;overflow:hidden;min-height:300px}.ycard::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.35)}.ycard .eyebrow{color:var(--yi)}.ycard>*{position:relative;z-index:1}

.mini{list-style:none;margin:14px 0 0;padding:0;max-width:62%}.mini li{padding:6px 0;border-bottom:1px solid rgba(0,0,0,.12);font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}tr:hover td{background:var(--sf2)}

.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-right:4px}.t-ok{background:#dff0d4;color:#1f5c3a}.t-low{background:#ffe9bd;color:#7a4a00}.t-bad{background:#fbd9d6;color:#9c1f18}.t-soon{background:#eef2b8;color:#4d5e00}
.al{border-left:5px solid var(--acc);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.al.crit{border-left-color:var(--bad)}.al.rev{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:30px}
dialog{border:none;border-radius:20px;padding:22px;background:var(--sf);color:var(--ink);width:min(430px,92vw);box-shadow:0 24px 60px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(8,22,14,.55)}label{display:block;font-size:13px;color:var(--mut);margin:9px 0 3px}dialog input,dialog select{width:100%}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--g);color:var(--on);padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.3s;z-index:30;font-weight:600}#toast.on{opacity:1;transform:translateX(-50%)}
button.av{border:0;cursor:pointer;font-weight:700;font-size:16px}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:thin}
.pc{flex:0 0 190px;scroll-snap-align:start;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:12px;transition:.25s}.pc:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.pt{height:130px;border-radius:14px;display:grid;place-items:center;position:relative;margin-bottom:10px;overflow:hidden}.pe{font-size:64px;animation:flt 3s ease-in-out infinite alternate}@keyframes flt{to{transform:translateY(-8px) rotate(4deg)}}
.bdg{position:absolute;top:8px;right:8px;background:var(--acc);color:#2a1f00;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}
#auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(135deg,#0f2a1c,#1f5c3a 60%,#d9a31b);padding:16px;overflow:auto}#auth[hidden]{display:none}.ac{width:min(400px,100%);margin-top:50px}
#promo{position:fixed;left:18px;bottom:18px;max-width:330px;display:flex;gap:12px;align-items:center;background:var(--y1);color:var(--yi);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);transform:translateY(160%);transition:.5s;z-index:19}#promo.on{transform:none}
#cb{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:78px;height:78px;border-radius:50%;border:3px solid var(--sf);background:linear-gradient(135deg,#ffd1e3,#c9f0dc);box-shadow:var(--sh);cursor:pointer;padding:2px;z-index:20;animation:bobc 2.4s ease-in-out infinite alternate}@keyframes bobc{to{transform:translateY(-6px)}}
#cp{position:fixed;right:18px;bottom:108px;width:min(360px,calc(100vw - 36px));height:min(480px,65vh);display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--bd);border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:20;overflow:hidden;animation:in .3s}#cp[hidden]{display:none}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,#ffd1e3,#c9f0dc);color:#2b1d3a}.hv{width:44px;height:44px;flex:none}
#cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:86%;padding:8px 12px;border-radius:16px;font-size:14px;animation:in .3s}.m.b{background:var(--sf2);border-bottom-left-radius:4px}.m.u{align-self:flex-end;background:var(--g);color:var(--on);border-bottom-right-radius:4px}
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 8px}.qr button{border:1px solid var(--bd);background:var(--sf2);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer}#cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}#cf input{flex:1}
.eyes{animation:blink 4s infinite;transform-origin:50px 58px}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}.tail{animation:sway 2.4s ease-in-out infinite alternate;transform-origin:50px 40px}@keyframes sway{to{transform:rotate(4deg)}}.spk{animation:tw 1.4s ease-in-out infinite alternate;transform-origin:82px 28px}@keyframes tw{to{transform:scale(1.5) rotate(20deg)}}
@media(max-width:820px){header{flex-wrap:wrap;padding:10px 14px}nav{order:3;width:100%;margin:0}.logo{margin-right:auto}main{padding:16px 14px 50px}.hero{height:440px}.htxt{left:20px;top:70px}.mini{max-width:100%}.crowd{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="logo"><i>🛒</i><div>SmartStock<small id="tag"></small></div></div><nav id="nav" aria-label="Main"></nav><button class="ib" id="va" aria-label="Auto voice alerts" title="Auto voice alerts"></button><button class="ib" id="lg" aria-label="Language"></button><button class="ib" id="th" aria-label="Toggle theme"></button><button class="av" id="av" aria-label="Account / Logout" title="Logout">M</button></header>
<main id="main"></main><dialog id="dlg"></dialog><div id="auth" hidden></div><div id="promo" role="status"></div><div id="bot"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),D=864e5,R=document.documentElement;
function ld(k,d){try{const v=localStorage.getItem("ss2_"+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem("ss2_"+k,JSON.stringify(v))}catch(e){}}
const iso=n=>new Date(Date.now()+n*D).toISOString().slice(0,10),rnd=(i,n)=>Math.abs(Math.sin(i*12.9898+n*78.233)*43758.5453)%1;
const DEPTS=[["produce","Produce","ताज़ी सब्ज़ी-फल","🥭"],["dairy","Dairy & Eggs","डेयरी और अंडे","🥛"],["snacks","Snacks & Biscuits","स्नैक्स और बिस्किट","🍪"],["bev","Beverages","पेय पदार्थ","🧃"],["bakery","Bakery","बेकरी","🍞"],["staples","Staples","आटा-दाल-चावल","🌾"],["pharm","Pharmacy","फार्मेसी","💊"]];
const DG=id=>DEPTS.find(d=>d[0]===id),CG={produce:"#c9e79a,#7fbf5a",dairy:"#e4f0ff,#a9c8f0",snacks:"#ffe1a8,#f0a04b",bev:"#ffd1b8,#f08a5d",bakery:"#f5deb3,#d9a066",staples:"#f3e7b0,#cdb35a",pharm:"#d7f0ec,#7cc7bb"};
const seed=()=>[["Aashirvaad Atta 5kg","staples",42,285,200,25,"🌾"],["Toor Dal 1kg","staples",9,165,60,15,"🫘"],["Amul Taza Milk 1L","dairy",18,68,1,30,"🥛"],["Amul Butter 500g","dairy",6,285,12,10,"🧈"],["Mother Dairy Curd 400g","dairy",25,45,3,20,"🥣"],["Britannia Bread","bakery",14,50,2,20,"🍞"],["Parle-G 800g","snacks",60,80,120,30,"🍪"],["Haldiram Bhujia 400g","snacks",3,120,90,12,"🥨"],["Maggi Noodles 12pk","snacks",34,168,150,20,"🍜"],["Bananas (dozen)","produce",20,60,2,15,"🍌"],["Tomatoes 1kg","produce",0,40,3,25,"🍅"],["Frooti Mango 1.2L","bev",48,70,110,24,"🧃"],["Tata Tea Gold 500g","bev",16,260,240,10,"🍵"],["Paracetamol 500mg","pharm",22,32,20,15,"💊"],["ORS Sachets (5)","pharm",8,60,6,15,"💧"]].map((r,i)=>({id:i+1,name:r[0],dept:r[1],qty:r[2],price:r[3],exp:iso(r[4]),min:r[5],em:r[6]}));
const S={inv:ld("inv",null)||seed(),lang:ld("lang","en"),rev:ld("rev",{}),dept:"dairy",slide:0,speaking:false,theme:ld("theme",null)};
const persist=()=>{if(!SB)sv("inv",S.inv);sv("rev",S.rev);sv("lang",S.lang);sv("theme",S.theme)};

/* ---- Supabase (cloud mode when config.js is filled in) ---- */
const CFG=window.SS_CONFIG||{},SB=(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase)?supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
const fromRow=(r,i)=>({id:i+1,cid:r.id,name:r.name,dept:r.dept,qty:r.qty,price:+r.price,exp:r.expiry,min:r.min_stock,em:r.emoji||"🛒",sale:r.on_sale,orig:r.orig_price!=null?+r.orig_price:undefined});
const toRow=p=>({name:p.name,dept:p.dept,qty:p.qty,price:p.price,expiry:p.exp,min_stock:p.min,emoji:p.em,on_sale:!!p.sale,orig_price:p.orig!=null?p.orig:null});
async function loadInv(){let r=await SB.from("products").select("*").order("created_at").order("name");if(r.error){toast(r.error.message);return}
if(!r.data.length){r=await SB.from("products").insert(seed().map(toRow)).select();if(r.error){toast(r.error.message);return}}
S.inv=r.data.map(fromRow)}
async function sync(p,why){if(!SB){persist();return}
try{const row=toRow(p);const r=p.cid?await SB.from("products").update(row).eq("id",p.cid).select().single():await SB.from("products").insert(row).select().single();if(r.error)throw r.error;p.cid=r.data.id;if(why){const l=await SB.from("stock_log").insert({product_id:p.cid,note:why});if(l.error)throw l.error}}
catch(e){toast("Cloud error: "+e.message)}}
const L=(e,h)=>S.lang==="hi"?h:e,esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),inr=n=>"₹"+Math.round(n).toLocaleString(S.lang==="hi"?"hi-IN":"en-IN");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}
const days=p=>Math.ceil((new Date(p.exp)-new Date(iso(0)))/D);
function st(p){const d=days(p),t=[];if(d<0)t.push([L("Expired","एक्सपायर"),"bad"]);else if(d<=3)t.push([L("Expires in "+d+"d",d+" दिन में एक्सपायर"),"bad"]);else if(d<=14)t.push([L("Sell first · "+d+"d","पहले बेचें · "+d+" दिन"),"soon"]);
if(p.qty===0)t.push([L("Out of stock","स्टॉक खत्म"),"bad"]);else if(p.qty<=p.min)t.push([L("Low stock","कम स्टॉक"),"low"]);if(!t.length)t.push([L("Healthy","सही"),"ok"]);if(p.sale)t.push(["SALE −20%","soon"]);return t}
const tg=p=>st(p).map(x=>`<span class="tag t-${x[1]}">${x[0]}</span>`).join(""),thumb=p=>`<span class="pi" aria-hidden="true" style="background:linear-gradient(135deg,${CG[p.dept]})">${p.em}</span>`;

return L("I can help with low stock, items to sell first, offers, stock value, or finding a product (try “where is milk”). 🌸","मैं कम स्टॉक, पहले बेचने वाले सामान, ऑफ़र, स्टॉक मूल्य या सामान की जगह में मदद कर सकती हूँ। 🌸")}
function send(t){t=t.trim();if(!t)return;msg(t,"u");const r=bot(t);setTimeout(()=>{msg(r,"b");if(S.auto)speakAll([r])},350)}
function chatLabels(){$("#cn").textContent=L("Hana · Store buddy","हाना · स्टोर साथी");$("#cs").textContent=L("Rule-based helper using your live stock","आपके लाइव स्टॉक पर आधारित सहायक");$("#ci").placeholder=L("Ask Hana…","हाना से पूछें…");$("#qr").innerHTML=[L("Low stock","कम स्टॉक"),L("Sell first","पहले बेचें"),L("Offers","ऑफ़र"),L("Stock value","स्टॉक मूल्य")].map(x=>`<button type="button">${x}</button>`).join("");$("#qr").onclick=e=>{if(e.target.tagName==="BUTTON")send(e.target.textContent)}}
$("#cb").onclick=()=>{const p=$("#cp");p.hidden=!p.hidden;if(!p.hidden){chatLabels();if(!$("#cm").children.length)msg(L(`Konnichiwa, ${nm()}! 🌸 I'm Hana, your store buddy. What shall we check?`,`नमस्ते ${nm()}! 🌸 मैं हाना हूँ। क्या देखें?`),"b");$("#ci").focus()}};
$("#cc").onclick=()=>$("#cp").hidden=true;$("#cf").onsubmit=e=>{e.preventDefault();send($("#ci").value);$("#ci").value=""};
$("#mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast(L("Voice input not supported here","यहाँ वॉइस इनपुट समर्थित नहीं"));const r=new SR();r.lang=S.lang==="hi"?"hi-IN":"en-IN";r.onresult=e=>send(e.results[0][0].transcript);r.onerror=()=>toast(L("Couldn't hear you","सुन नहीं पाई"));r.start()};
/* header controls */
const vaUI=()=>$("#va").textContent=S.auto?"🔊":"🔇";vaUI();
$("#va").onclick=()=>{S.auto=!S.auto;sv("auto",S.auto);vaUI();toast(S.auto?L("Auto voice alerts ON","ऑटो वॉइस अलर्ट चालू"):L("Auto voice alerts OFF","ऑटो वॉइस अलर्ट बंद"));if(S.auto)speakAll(pend().slice(0,3).map(x=>x[S.lang]))};
$("#av").onclick=()=>{if(confirm(L("Log out?","लॉग आउट करें?"))){if(SB){SB.auth.signOut();S.inv=[]}AU.user=null;sv("user",null);$("#cp").hidden=true;authShow("in")}};
addEventListener("hashchange",render);
(async()=>{if(SB){const g=await SB.auth.getSession();if(g.data.session){const u=g.data.session.user;AU.user={email:u.email,name:(u.user_metadata&&u.user_metadata.name)||u.email.split("@")[0]};await loadInv()}else AU.user=null}render();if(!AU.user)authShow("in")})();
</script></body></html>
